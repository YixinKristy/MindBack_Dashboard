<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SetLog Flow — MindBack Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <style>
    /* ── Design Tokens ── */
    :root {
      --mb-paper: #F9F4EC;
      --mb-paper-warm: #F3EADD;
      --mb-paper-cool: #F7F7F7;
      --mb-white: #FFFFFF;
      --mb-ink: #192749;
      --mb-ink-900: #212121;
      --mb-ink-700: #333333;
      --mb-ink-500: #7B7B7B;
      --mb-ink-400: #C5C5C7;
      --mb-ink-300: #D9D9D9;
      --mb-ink-200: #EAEAEA;
      --mb-ink-100: #F3F3F3;
      --mb-ink-50: #FAFAFA;
      --mb-kraft: #916964;
      --mb-kraft-deep: #4E1E08;
      --mb-sky: #78AAFA;
      --mb-sky-soft: #779EDC;
      --mb-font-display: "HuoshanYunsong", "Songti SC", "STSong", serif;
      --mb-font-body: "IdeaFonts DianYuan", -apple-system, "PingFang SC", "Hiragino Sans GB", "Inter", sans-serif;
      --mb-font-hand: "Caveat", "Patrick Hand", cursive;
      --mb-font-mono: "JetBrains Mono", "SF Mono", ui-monospace, monospace;
      --mb-shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
      --mb-shadow-card: 0 8px 24px rgba(0,0,0,0.08);
      --mb-shadow-pop: 0 2px 8px rgba(0,0,0,0.12);
      --mb-shadow-lg: 0 20px 60px rgba(0,0,0,0.16);
      --mb-ease: cubic-bezier(0.4,0,0.2,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--mb-font-body);
      background: #f0eee9;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }
    #root { width: 100%; height: 100%; }

    .canvas-root {
      position: relative; width: 100%; height: 100%;
      overflow: hidden; cursor: grab;
    }
    .canvas-root.panning { cursor: grabbing; }
    .canvas-stage {
      position: absolute; top: 0; left: 0;
      transform-origin: 0 0; will-change: transform;
    }
    .dot-grid {
      position: fixed; inset: 0;
      background-image: radial-gradient(circle, rgba(0,0,0,0.07) 1px, transparent 1px);
      background-size: 20px 20px;
      pointer-events: none; z-index: 0;
    }
    .section-label {
      font-family: var(--mb-font-mono); font-size: 11px;
      color: rgba(0,0,0,0.38); letter-spacing: 0.07em;
      text-transform: uppercase; margin-bottom: 20px; padding-left: 2px;
    }
    .artboard-row {
      display: flex; gap: 44px; margin-bottom: 72px; align-items: flex-start;
    }
    .artboard-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .artboard-label {
      font-family: var(--mb-font-mono); font-size: 10px;
      color: rgba(0,0,0,0.32); letter-spacing: 0.08em; text-transform: uppercase;
    }
    .artboard-card {
      border-radius: 4px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
      overflow: hidden; transition: box-shadow 0.15s;
    }
    .artboard-card:hover {
      box-shadow: 0 2px 6px rgba(0,0,0,.12), 0 8px 28px rgba(0,0,0,.10);
    }
    .toolbar {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
      border: 1px solid rgba(0,0,0,0.08); border-radius: 12px;
      padding: 8px 18px; display: flex; align-items: center; gap: 14px;
      font-family: var(--mb-font-mono); font-size: 11px; color: rgba(0,0,0,0.45);
      z-index: 1000; box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      white-space: nowrap;
    }
    .toolbar-btn {
      background: none; border: none; cursor: pointer;
      font-family: var(--mb-font-mono); font-size: 11px;
      color: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 6px;
      transition: background 0.12s;
    }
    .toolbar-btn:hover { background: rgba(0,0,0,0.06); }
    .toolbar-sep { color: rgba(0,0,0,0.2); }
    .focus-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.72);
      backdrop-filter: blur(14px); z-index: 900;
      display: flex; align-items: center; justify-content: center;
    }
    .focus-nav {
      position: fixed; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.14); border: none; color: white;
      font-size: 22px; width: 44px; height: 44px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      z-index: 910; transition: background 0.12s;
    }
    .focus-nav:hover { background: rgba(255,255,255,0.24); }
    .focus-nav.prev { left: 24px; }
    .focus-nav.next { right: 24px; }
    .focus-close {
      position: fixed; top: 20px; right: 20px;
      background: rgba(255,255,255,0.14); border: none; color: white;
      width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
      z-index: 910; display: flex; align-items: center; justify-content: center;
      font-size: 16px; transition: background 0.12s;
    }
    .focus-close:hover { background: rgba(255,255,255,0.24); }
    .focus-meta {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      font-family: var(--mb-font-mono); font-size: 11px;
      color: rgba(255,255,255,0.5); pointer-events: none;
    }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.14); border-radius: 2px; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
    @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    @keyframes toastDrop { from{opacity:0;transform:translateX(-50%) translateY(-6px)} to{opacity:1;transform:translateX(-50%) translateY(0)} }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Palette ──
const C = {
  paper: '#F9F4EC', paperWarm: '#F3EADD', paperCool: '#F7F7F7',
  white: '#FFFFFF', ink: '#192749', ink900: '#212121', ink700: '#333333',
  ink500: '#7B7B7B', ink400: '#C5C5C7', ink300: '#D9D9D9', ink200: '#EAEAEA',
  ink100: '#F3F3F3', ink50: '#FAFAFA',
  kraft: '#916964', kraftDeep: '#4E1E08',
  sky: '#78AAFA', skySoft: '#779EDC', paperBlue: '#C5DDF5',
};

// ── Photo gradients (10 palettes) ──
const PALETTES = [
  ['#1a1a2e','#16213e','#0f3460'], // night
  ['#2d1b69','#11998e','#38ef7d'], // concert
  ['#d4a574','#c8956c','#a0522d'], // cafe
  ['#87CEEB','#4682B4','#191970'], // sky
  ['#228B22','#006400','#2F4F4F'], // forest
  ['#006994','#0077b6','#023e8a'], // ocean
  ['#ff6b6b','#feca57','#ff9ff3'], // warm
  ['#f093fb','#f5576c','#fd7b33'], // dusk
  ['#56ab2f','#a8e6cf','#dcedc1'], // meadow
  ['#232526','#414345','#0f2027'], // midnight
];
const photoGrad = (seed=0) => {
  const [a,b,d] = PALETTES[seed % PALETTES.length];
  return `linear-gradient(135deg, ${a}, ${b}, ${d})`;
};

// ── Icons ──
const Ico = {
  Back: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  Close: () => <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M13.5 4.5l-9 9M4.5 4.5l9 9" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>,
  Sparkle: ({s=14}) => <svg width={s} height={s} viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l1.6 5.4L15 8l-5.4 1.6L8 15l-1.6-5.4L1 8l5.4-1.6z"/></svg>,
  Camera: ({s=18}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>,
  Share: ({s=16}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>,
  Chev: ({d='r',s=14}) => {
    const p={r:'M9 18l6-6-6-6',l:'M15 18l-6-6 6-6',d:'M6 9l6 6 6-6',u:'M18 15l-6-6-6 6'};
    return <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d={p[d]} strokeLinecap="round" strokeLinejoin="round"/></svg>;
  },
  Check: ({s=14}) => <svg width={s} height={s} viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="2"><path d="M2 7l3.5 3.5 6-6" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  Plus: ({s=18}) => <svg width={s} height={s} viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 3v12M3 9h12" strokeLinecap="round"/></svg>,
  Pin: ({s=13}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>,
  Clock: ({s=13}) => <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
};

// ── Pill ──
function Pill({ children, variant='default', sm=true, style: sx={} }) {
  const variants = {
    default: { bg:'#EEF4EC', fg:'#4B7A53' },
    kraft:   { bg:'#F3E8E6', fg:'#916964' },
    sky:     { bg:'#E6EEFB', fg:'#3A6FD0' },
    mint:    { bg:'#E8F5EC', fg:'#3E8C5A' },
    peach:   { bg:'#FDEEDC', fg:'#C06B28' },
    black:   { bg:'#212121', fg:'#FFFFFF' },
    white:   { bg:'rgba(255,255,255,0.9)', fg:'#333333' },
    ghost:   { bg:'rgba(0,0,0,0.08)', fg:'#7B7B7B' },
  };
  const v = variants[variant] || variants.default;
  return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap:3,
      background:v.bg, color:v.fg,
      fontSize: sm?11:12, fontFamily:'var(--mb-font-mono)', fontWeight:500, lineHeight:1,
      padding: sm?'3px 8px':'4px 10px', borderRadius:999, whiteSpace:'nowrap',
      ...sx,
    }}>
      {children}
    </span>
  );
}

// ── Avatar ──
const AVATAR_BG = ['#FFB3A7','#AECBFA','#B5EAD7','#FFDAC1','#C7CEEA','#F2D2BD','#85C1E9','#A9CCE3'];
function Avatar({ name='?', size=28, ring=true }) {
  const bg = AVATAR_BG[name.charCodeAt(0) % AVATAR_BG.length];
  return (
    <div style={{
      width:size, height:size, borderRadius:'50%', background:bg, flexShrink:0,
      display:'flex', alignItems:'center', justifyContent:'center',
      fontSize:size*0.38, fontWeight:600, color:C.ink700,
      border: ring?'2px solid white':'none',
    }}>
      {name[0]}
    </div>
  );
}
function AvatarStack({ names=[], size=26 }) {
  return (
    <div style={{display:'flex'}}>
      {names.map((n,i)=>(
        <div key={i} style={{marginLeft:i>0?-8:0, zIndex:names.length-i}}><Avatar name={n} size={size}/></div>
      ))}
    </div>
  );
}

// ── Photo placeholder ──
function Photo({ seed=0, w='100%', h=160, r=8, overlay=false, children, sx={} }) {
  return (
    <div style={{
      width:w, height:h, borderRadius:r,
      background:photoGrad(seed), position:'relative', overflow:'hidden', flexShrink:0, ...sx,
    }}>
      {overlay && <div style={{position:'absolute',inset:0,background:'linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0.15))'}}/>}
      {children}
    </div>
  );
}

// ── StatusBar ──
function StatusBar({ dark=false }) {
  const fg = dark ? 'rgba(255,255,255,0.9)' : C.ink900;
  return (
    <div style={{height:44,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 24px 0 28px',flexShrink:0}}>
      <span style={{fontFamily:'var(--mb-font-mono)',fontSize:15,fontWeight:600,color:fg}}>9:41</span>
      <div style={{display:'flex',alignItems:'center',gap:5}}>
        {/* Signal */}
        <svg width="17" height="11" viewBox="0 0 17 11" fill={fg}>
          <rect x="0" y="5" width="3" height="6" rx="1"/>
          <rect x="4.5" y="3" width="3" height="8" rx="1"/>
          <rect x="9" y="1" width="3" height="10" rx="1"/>
          <rect x="13.5" y="0" width="3" height="11" rx="1"/>
        </svg>
        {/* WiFi */}
        <svg width="15" height="11" viewBox="0 0 15 11" fill={fg}>
          <path d="M7.5 8.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3z"/>
          <path d="M3.2 5.8a6.1 6.1 0 018.6 0" stroke={fg} strokeWidth="1.4" fill="none" strokeLinecap="round"/>
          <path d="M0.5 3.2a9.9 9.9 0 0114 0" stroke={fg} strokeWidth="1.4" fill="none" strokeLinecap="round"/>
        </svg>
        {/* Battery */}
        <div style={{display:'flex',alignItems:'center',gap:1}}>
          <div style={{width:25,height:12,border:`1.5px solid ${fg}`,borderRadius:3,display:'flex',alignItems:'center',padding:'1.5px'}}>
            <div style={{width:'82%',height:'100%',background:fg,borderRadius:1.5}}/>
          </div>
          <div style={{width:2,height:5,background:fg,borderRadius:1,opacity:0.6}}/>
        </div>
      </div>
    </div>
  );
}

// ── HomeIndicator ──
function HomeBar({ dark=false }) {
  return (
    <div style={{
      position:'absolute', bottom:8, left:'50%', transform:'translateX(-50%)',
      width:134, height:5, borderRadius:999,
      background: dark?'rgba(255,255,255,0.38)':'rgba(0,0,0,0.18)',
    }}/>
  );
}

// ── NavBar ──
function NavBar({ title, subtitle, left, right, bg=C.white, dark=false, divider=true }) {
  const tc = dark ? 'white' : C.ink900;
  const sc = dark ? 'rgba(255,255,255,0.6)' : C.ink500;
  return (
    <div style={{background:bg, flexShrink:0, borderBottom: divider?`1px solid rgba(0,0,0,0.06)`:'none'}}>
      <div style={{height:44, display:'flex', alignItems:'center', padding:'0 10px'}}>
        <div style={{flex:1, display:'flex', alignItems:'center', justifyContent:'flex-start'}}>
          {left || <div style={{width:44}}/>}
        </div>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:16, fontWeight:600, color:tc, lineHeight:1.2}}>{title}</div>
          {subtitle && <div style={{fontSize:11,color:sc,marginTop:1,fontFamily:'var(--mb-font-mono)'}}>{subtitle}</div>}
        </div>
        <div style={{flex:1, display:'flex', alignItems:'center', justifyContent:'flex-end'}}>
          {right || <div style={{width:44}}/>}
        </div>
      </div>
    </div>
  );
}

// ── NavButton ──
function NavBtn({ children, onClick, color=C.ink900 }) {
  return (
    <button onClick={onClick} style={{background:'none',border:'none',cursor:'pointer',color,padding:'8px 12px',display:'flex',alignItems:'center'}}>
      {children}
    </button>
  );
}

// ── Sheet ──
function Sheet({ title, children, pad=true }) {
  return (
    <div style={{position:'absolute',inset:0,zIndex:50}}>
      <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.42)'}}/>
      <div style={{
        position:'absolute', bottom:0, left:0, right:0,
        background:C.white, borderRadius:'22px 22px 0 0',
        animation:'slideUp 0.26s var(--mb-ease)', maxHeight:'85%', overflowY:'auto',
      }}>
        <div style={{display:'flex',justifyContent:'center',padding:'10px 0 0'}}>
          <div style={{width:36,height:5,borderRadius:999,background:C.ink300}}/>
        </div>
        {title && (
          <div style={{padding:'14px 20px 12px',fontSize:16,fontWeight:600,color:C.ink900,borderBottom:`1px solid ${C.ink200}`}}>
            {title}
          </div>
        )}
        <div style={pad?{padding:'12px 16px 36px'}:{}}>{children}</div>
      </div>
    </div>
  );
}

// ── Toast ──
function Toast({ children, variant='kraft' }) {
  const bg = variant==='kraft' ? C.kraft : C.ink900;
  return (
    <div style={{
      position:'absolute', top:52, left:'50%', transform:'translateX(-50%)',
      background:bg, color:'white', fontSize:13, fontWeight:500,
      padding:'8px 16px', borderRadius:12, whiteSpace:'nowrap',
      animation:'toastDrop 0.2s var(--mb-ease)', zIndex:80,
      boxShadow:'0 4px 16px rgba(0,0,0,0.22)',
    }}>
      {children}
    </div>
  );
}

// ── ProgressBar ──
function Bar({ val, max, label, color=C.kraft }) {
  const pct = Math.min(100, (val/max)*100);
  return (
    <div>
      {label !== undefined && (
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
          <span style={{fontSize:11,fontFamily:'var(--mb-font-mono)',color:C.ink500}}>{label}</span>
          <span style={{fontSize:11,fontFamily:'var(--mb-font-mono)',color}}>{val}/{max}</span>
        </div>
      )}
      <div style={{height:4,background:C.ink200,borderRadius:999,overflow:'hidden'}}>
        <div style={{height:'100%',width:`${pct}%`,background:color,borderRadius:999,transition:'width 0.4s var(--mb-ease)'}}/>
      </div>
    </div>
  );
}

// ── Phone Frame ──
function Phone({ children, bg=C.paper, dark=false }) {
  return (
    <div style={{
      width:393, height:780, background:bg, borderRadius:44,
      boxShadow:'0 30px 80px rgba(0,0,0,.20)', overflow:'hidden',
      position:'relative', display:'flex', flexDirection:'column',
    }}>
      {/* Dynamic island notch */}
      <div style={{
        position:'absolute', top:12, left:'50%', transform:'translateX(-50%)',
        width:116, height:34, borderRadius:22, background:'#0a0a0a', zIndex:200,
      }}/>
      {children}
      <HomeBar dark={dark}/>
    </div>
  );
}

// ──────────────────────────────────────────────────────────────────────────────
// FLOW A — Chip-driven participation (80% users)
// ──────────────────────────────────────────────────────────────────────────────

// A1: Home chat — user photo + AI chip
function ScreenA1() {
  return (
    <Phone bg={C.paper}>
      <StatusBar/>
      <NavBar
        title="MindBack"
        bg={C.white}
        right={<NavBtn color={C.ink500}><Ico.Share s={18}/></NavBtn>}
      />
      <div style={{flex:1,overflowY:'auto',padding:'12px 14px',display:'flex',flexDirection:'column',gap:12}}>
        {/* AI bubble */}
        <div style={{display:'flex',gap:8,alignItems:'flex-start'}}>
          <div style={{width:30,height:30,borderRadius:'50%',background:C.ink,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <span style={{color:'white',fontSize:12,fontWeight:700}}>M</span>
          </div>
          <div style={{background:C.paperWarm,borderRadius:'4px 16px 16px 16px',padding:'10px 14px',maxWidth:'68%',fontSize:14,color:C.ink900,lineHeight:1.6}}>
            今天天气不错，有什么想记录的吗？✨
          </div>
        </div>
        {/* User photo bubble */}
        <div style={{display:'flex',justifyContent:'flex-end'}}>
          <div>
            <Photo seed={0} w={180} h={210} r={14}/>
            <div style={{textAlign:'right',marginTop:4}}>
              <span style={{fontSize:11,color:C.ink400}}>20:31</span>
            </div>
          </div>
        </div>
        {/* AI Chip — SetLog suggestion */}
        <div style={{animation:'fadeInUp 0.35s var(--mb-ease)'}}>
          <div style={{
            background:C.white, border:`1.5px solid ${C.kraft}`,
            borderRadius:16, padding:'12px 14px',
            display:'flex', alignItems:'center', gap:10,
            boxShadow:`0 3px 12px rgba(145,105,100,0.16)`,
            maxWidth:288,
          }}>
            <div style={{
              width:38, height:38, borderRadius:12, flexShrink:0,
              background:`linear-gradient(135deg, ${C.kraft}, ${C.kraftDeep})`,
              display:'flex', alignItems:'center', justifyContent:'center', fontSize:20,
            }}>
              🎬
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,fontWeight:600,color:C.ink900}}>加入或发起 SetLog</div>
              <div style={{fontSize:11,color:C.ink500,marginTop:2}}>1 个活动匹配你的素材时间</div>

function DesignCanvas() {
  const [vp, setVp] = useState({x:60, y:60, scale:0.48});
  const [panning, setPanning] = useState(false);
  const [focus, setFocus] = useState(null);
  const rootRef = useRef(null);
  const lastXY = useRef(null);

  // Wheel: pan or pinch-zoom
  const onWheel = useCallback(e => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      const rect = rootRef.current.getBoundingClientRect();
      const cx = e.clientX - rect.left;
      const cy = e.clientY - rect.top;
      const dz = -e.deltaY * 0.0018;
      setVp(v => {
        const ns = Math.max(0.1, Math.min(4, v.scale * (1+dz)));
        const r = ns / v.scale;
        return {scale:ns, x:cx-(cx-v.x)*r, y:cy-(cy-v.y)*r};
      });
    } else {
      setVp(v => ({...v, x:v.x-e.deltaX, y:v.y-e.deltaY}));
    }
  }, []);

  useEffect(() => {
    const el = rootRef.current;
    if (!el) return;
    el.addEventListener('wheel', onWheel, {passive:false});
    return () => el.removeEventListener('wheel', onWheel);
  }, [onWheel]);

  const onMouseDown = e => {
    const bg = e.target.classList.contains('canvas-bg') || e.target === rootRef.current;
    if (!bg || (e.button!==0 && e.button!==1)) return;
    setPanning(true);
    lastXY.current = {x:e.clientX, y:e.clientY};
  };
  const onMouseMove = e => {
    if (!panning || !lastXY.current) return;
    const dx = e.clientX - lastXY.current.x;
    const dy = e.clientY - lastXY.current.y;
    lastXY.current = {x:e.clientX, y:e.clientY};
    setVp(v => ({...v, x:v.x+dx, y:v.y+dy}));
  };
  const onMouseUp = () => { setPanning(false); lastXY.current=null; };

  // Keyboard nav in focus mode
  useEffect(() => {
    const h = e => {
      if (focus===null) return;
      if (e.key==='Escape') setFocus(null);
      if (e.key==='ArrowRight' && focus < SCREENS.length-1) setFocus(f=>f+1);
      if (e.key==='ArrowLeft' && focus > 0) setFocus(f=>f-1);
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [focus]);

  const resetVp = () => setVp({x:60, y:60, scale:0.48});

  return (
    <div
      ref={rootRef}
      className={`canvas-root${panning?' panning':''}`}
      onMouseDown={onMouseDown}
      onMouseMove={onMouseMove}
      onMouseUp={onMouseUp}
      onMouseLeave={onMouseUp}
    >
      <div className="dot-grid canvas-bg"/>
      <div className="canvas-stage" style={{transform:`translate(${vp.x}px,${vp.y}px) scale(${vp.scale})`}}>
        <div style={{padding:48}}>
          {SECTIONS.map((sec,si)=>(
            <div key={si} style={{marginBottom:88}}>
              <div className="section-label">{sec.label}</div>
              <div className="artboard-row">
                {sec.ids.map(id=>{
                  const s = screenMap[id];
                  if (!s) return null;
                  const {Comp} = s;
                  return (
                    <div key={id} className="artboard-wrap">
                      <div
                        className="artboard-card"
                        style={{cursor:'pointer'}}
                        onClick={()=>setFocus(s.idx)}
                      >
                        <Comp/>
                      </div>
                      <div className="artboard-label">{s.label}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Focus / fullscreen overlay */}
      {focus !== null && (() => {
        const s = SCREENS[focus];
        const {Comp} = s;
        return (
          <div className="focus-overlay" onClick={()=>setFocus(null)}>
            <div onClick={e=>e.stopPropagation()}>
              <Comp/>
            </div>
            {focus > 0 && (
              <button className="focus-nav prev" onClick={()=>setFocus(f=>f-1)}>←</button>
            )}
            {focus < SCREENS.length-1 && (
              <button className="focus-nav next" onClick={()=>setFocus(f=>f+1)}>→</button>
            )}
            <button className="focus-close" onClick={()=>setFocus(null)}>✕</button>
            <div className="focus-meta">
              {s.label} &nbsp;·&nbsp; {focus+1} / {SCREENS.length} &nbsp;·&nbsp; ← → 切换 &nbsp; Esc 关闭
            </div>
          </div>
        );
      })()}

      {/* Toolbar */}
      <div className="toolbar">
        <span style={{fontWeight:600,color:'rgba(0,0,0,0.65)'}}>SetLog Flow</span>
        <span className="toolbar-sep">·</span>
        <span>{Math.round(vp.scale*100)}%</span>
        <button className="toolbar-btn" onClick={resetVp}>重置视图</button>
        <button className="toolbar-btn" onClick={()=>setVp(v=>({...v,scale:Math.min(4,v.scale*1.2)}))}>放大</button>
        <button className="toolbar-btn" onClick={()=>setVp(v=>({...v,scale:Math.max(0.1,v.scale/1.2)}))}>缩小</button>
        <span className="toolbar-sep">·</span>
        <span style={{color:'rgba(0,0,0,0.3)'}}>点击 artboard 全屏 · ← → 切换</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<DesignCanvas/>);
</script>
</body>
</html>
