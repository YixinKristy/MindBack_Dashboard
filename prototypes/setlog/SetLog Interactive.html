<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SetLog — Interactive App</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<style>
:root {
  --paper:#F9F4EC; --paper-warm:#F3EADD;
  --white:#fff; --ink:#192749;
  --ink9:#212121; --ink7:#333; --ink5:#7B7B7B;
  --ink4:#C5C5C7; --ink3:#D9D9D9; --ink2:#EAEAEA;
  --ink1:#F3F3F3; --ink05:#FAFAFA;
  --kraft:#916964; --kraft-d:#4E1E08;
  --sky:#78AAFA; --sky-s:#779EDC; --pb:#C5DDF5;
  --ease:cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:#e8e3dc;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;
  overflow:hidden;
}
#root{display:flex;flex-direction:column;align-items:center;gap:16px}

/* ── Phone shell ── */
.phone{
  width:390px;height:780px;
  background:var(--paper);
  border-radius:48px;
  box-shadow:0 32px 80px rgba(0,0,0,.24),inset 0 0 0 1px rgba(0,0,0,.08);
  overflow:hidden;position:relative;
  display:flex;flex-direction:column;
}
.phone-screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}

/* ── Transitions ── */
@keyframes slideInR{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes slideOutL{from{transform:translateX(0)}to{transform:translateX(-28%)}}
@keyframes slideInL{from{transform:translateX(-28%)}to{transform:translateX(0)}}
@keyframes slideOutR{from{transform:translateX(0)}to{transform:translateX(100%)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes sheetDown{from{transform:translateY(0)}to{transform:translateY(100%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes chipIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes chipOut{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.92)}}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-6px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}

.enter-r{animation:slideInR .3s var(--ease) forwards}
.exit-l {animation:slideOutL .3s var(--ease) forwards}
.enter-l{animation:slideInL .3s var(--ease) forwards}
.exit-r {animation:slideOutR .3s var(--ease) forwards}

/* scrollbars */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.12);border-radius:2px}

/* ── Bottom nav for demo ── */
.demo-nav{
  display:flex;gap:8px;
  background:rgba(255,255,255,.88);backdrop-filter:blur(12px);
  border:1px solid rgba(0,0,0,.08);border-radius:12px;
  padding:6px 10px;
}
.demo-btn{
  background:none;border:none;cursor:pointer;
  font-size:11px;font-family:monospace;color:rgba(0,0,0,.5);
  padding:5px 10px;border-radius:7px;transition:background .12s;
  white-space:nowrap;
}
.demo-btn:hover,.demo-btn.active{background:rgba(0,0,0,.07);color:rgba(0,0,0,.75)}
.demo-sep{color:rgba(0,0,0,.2);font-size:11px;align-self:center}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useContext,createContext,useMemo}=React;

/* ════════════════════════════════════════
   TOKENS
════════════════════════════════════════ */
const C={
  paper:'#F9F4EC',warm:'#F3EADD',white:'#fff',
  ink:'#192749',ink9:'#212121',ink7:'#333',ink5:'#7B7B7B',
  ink4:'#C5C5C7',ink3:'#D9D9D9',ink2:'#EAEAEA',ink1:'#F3F3F3',ink05:'#FAFAFA',
  kraft:'#916964',kraftD:'#4E1E08',
  sky:'#78AAFA',skyS:'#779EDC',pb:'#C5DDF5',
};
const PALS=[
  ['#1a1a2e','#16213e','#0f3460'],['#2d1b69','#11998e','#38ef7d'],
  ['#d4a574','#c8956c','#a0522d'],['#87CEEB','#4682B4','#191970'],
  ['#228B22','#006400','#2F4F4F'],['#006994','#0077b6','#023e8a'],
  ['#f093fb','#f5576c','#fd7b33'],['#56ab2f','#a8e6cf','#dcedc1'],
  ['#232526','#414345','#0f2027'],['#8e2de2','#4a00e0','#2d1b69'],
];
const grad=(s=0)=>{const[a,b,d]=PALS[s%PALS.length];return`linear-gradient(135deg,${a},${b},${d})`};

/* ════════════════════════════════════════
   NAV CONTEXT
════════════════════════════════════════ */
const NavCtx=createContext(null);
const useNav=()=>useContext(NavCtx);

/* ════════════════════════════════════════
   ICONS
════════════════════════════════════════ */
const Back=()=><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const X=({s=18})=><svg width={s} height={s} viewBox="0 0 18 18" fill="none"><path d="M13.5 4.5l-9 9M4.5 4.5l9 9" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>;
const Spark=({s=14})=><svg width={s} height={s} viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l1.6 5.4L15 8l-5.4 1.6L8 15l-1.6-5.4L1 8l5.4-1.6z"/></svg>;
const Share=({s=16})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>;
const Chev=({d='r',s=14})=>{const p={r:'M9 18l6-6-6-6',l:'M15 18l-6-6 6-6',d:'M6 9l6 6 6-6',u:'M18 15l-6-6-6 6'};return<svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d={p[d]} strokeLinecap="round" strokeLinejoin="round"/></svg>};
const Plus=({s=18})=><svg width={s} height={s} viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2.2"><path d="M9 3v12M3 9h12" strokeLinecap="round"/></svg>;
const Camera=({s=20})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>;
const Clock=({s=12})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
const Pin=({s=12})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>;

/* ════════════════════════════════════════
   SHARED UI
════════════════════════════════════════ */
function Pill({children,v='default',sm=true,sx={}}){
  const vs={
    default:{bg:'#EEF4EC',fg:'#4B7A53'},kraft:{bg:'#F3E8E6',fg:'#916964'},
    sky:{bg:'#E6EEFB',fg:'#3A6FD0'},mint:{bg:'#E8F5EC',fg:'#3E8C5A'},
    peach:{bg:'#FDEEDC',fg:'#C06B28'},black:{bg:'#212121',fg:'#fff'},
    white:{bg:'rgba(255,255,255,.92)',fg:'#333'},ghost:{bg:'rgba(0,0,0,.07)',fg:'#7B7B7B'},
  };
  const vv=vs[v]||vs.default;
  return(
    <span style={{
      display:'inline-flex',alignItems:'center',gap:3,
      background:vv.bg,color:vv.fg,
      fontSize:sm?11:12,fontFamily:'monospace',fontWeight:500,lineHeight:1,
      padding:sm?'3px 8px':'4px 10px',borderRadius:999,whiteSpace:'nowrap',...sx,
    }}>{children}</span>
  );
}

const AVBG=['#FFB3A7','#AECBFA','#B5EAD7','#FFDAC1','#C7CEEA','#F2D2BD','#85C1E9'];
function Av({name='?',size=28}){
  const bg=AVBG[name.charCodeAt(0)%AVBG.length];
  return(
    <div style={{
      width:size,height:size,borderRadius:'50%',background:bg,flexShrink:0,
      display:'flex',alignItems:'center',justifyContent:'center',
      fontSize:size*.38,fontWeight:600,color:C.ink7,border:'2px solid white',
    }}>{name[0]}</div>
  );
}
function AvStack({names=[],size=26}){
  return(<div style={{display:'flex'}}>
    {names.map((n,i)=><div key={i} style={{marginLeft:i>0?-8:0,zIndex:names.length-i}}><Av name={n} size={size}/></div>)}
  </div>);
}

function Img({seed=0,w='100%',h=160,r=8,overlay=false,children,sx={}}){
  return(
    <div style={{width:w,height:h,borderRadius:r,background:grad(seed),position:'relative',overflow:'hidden',flexShrink:0,...sx}}>
      {overlay&&<div style={{position:'absolute',inset:0,background:'linear-gradient(to top,rgba(0,0,0,.58),rgba(0,0,0,.12))'}}/>}
      {children}
    </div>
  );
}

function SB({dark=false}){
  const fg=dark?'rgba(255,255,255,.9)':C.ink9;
  return(
    <div style={{height:44,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 24px 0 28px',flexShrink:0}}>
      <span style={{fontFamily:'monospace',fontSize:15,fontWeight:600,color:fg}}>9:41</span>
      <div style={{display:'flex',alignItems:'center',gap:5}}>
        <svg width="17" height="11" viewBox="0 0 17 11" fill={fg}>
          <rect x="0" y="5" width="3" height="6" rx="1"/>
          <rect x="4.5" y="3" width="3" height="8" rx="1"/>
          <rect x="9" y="1" width="3" height="10" rx="1"/>
          <rect x="13.5" y="0" width="3" height="11" rx="1"/>
        </svg>
        <svg width="15" height="11" viewBox="0 0 15 11" fill="none">
          <path d="M7.5 8a1.5 1.5 0 110 3 1.5 1.5 0 010-3z" fill={fg}/>
          <path d="M3.2 5.5a6.1 6.1 0 018.6 0" stroke={fg} strokeWidth="1.4" strokeLinecap="round"/>
          <path d="M0.5 3a10 10 0 0114 0" stroke={fg} strokeWidth="1.4" strokeLinecap="round"/>
        </svg>
        <div style={{display:'flex',alignItems:'center',gap:1}}>
          <div style={{width:25,height:12,border:`1.5px solid ${fg}`,borderRadius:3,display:'flex',alignItems:'center',padding:'1.5px'}}>
            <div style={{width:'82%',height:'100%',background:fg,borderRadius:1.5}}/>
          </div>
          <div style={{width:2,height:5,background:fg,borderRadius:1,opacity:.6}}/>
        </div>
      </div>
    </div>
  );
}

function NB({title,sub,left,right,bg=C.white,dark=false,line=true}){
  const tc=dark?'white':C.ink9;
  return(
    <div style={{background:bg,flexShrink:0,borderBottom:line?`1px solid rgba(0,0,0,.06)`:'none'}}>
      <div style={{height:44,display:'flex',alignItems:'center',padding:'0 8px'}}>
        <div style={{flex:1,display:'flex',alignItems:'center'}}>{left||<div style={{width:44}}/>}</div>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:16,fontWeight:600,color:tc,lineHeight:1.2}}>{title}</div>
          {sub&&<div style={{fontSize:11,color:dark?'rgba(255,255,255,.6)':C.ink5,marginTop:1,fontFamily:'monospace'}}>{sub}</div>}
        </div>
        <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'flex-end'}}>{right||<div style={{width:44}}/>}</div>
      </div>
    </div>
  );
}

function NBBtn({children,onClick,color=C.ink9}){
  return(
    <button onClick={onClick} style={{background:'none',border:'none',cursor:'pointer',color,padding:'8px 12px',display:'flex',alignItems:'center',lineHeight:1}}>
      {children}
    </button>
  );
}

function Bar({val,max,label,color=C.kraft}){
  const pct=Math.min(100,(val/max)*100);
  return(
    <div>
      {label!==undefined&&<div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
        <span style={{fontSize:11,fontFamily:'monospace',color:C.ink5}}>{label}</span>
        <span style={{fontSize:11,fontFamily:'monospace',color}}>{val}/{max}</span>
      </div>}
      <div style={{height:4,background:C.ink2,borderRadius:999,overflow:'hidden'}}>
        <div style={{height:'100%',width:`${pct}%`,background:color,borderRadius:999,transition:'width .5s var(--ease)'}}/>
      </div>
    </div>
  );
}

/* Notch */
const Notch=()=><div style={{position:'absolute',top:12,left:'50%',transform:'translateX(-50%)',width:120,height:34,borderRadius:22,background:'#0a0a0a',zIndex:200,pointerEvents:'none'}}/>;
const HomeBar=({dark=false})=><div style={{position:'absolute',bottom:8,left:'50%',transform:'translateX(-50%)',width:134,height:5,borderRadius:999,background:dark?'rgba(255,255,255,.35)':'rgba(0,0,0,.18)'}}/>;

/* ════════════════════════════════════════
   SHEET
════════════════════════════════════════ */
function Sheet({title,children,onClose,pad=true,maxH='82%'}){
  const [closing,setClosing]=useState(false);
  function close(){
    setClosing(true);
    setTimeout(()=>{setClosing(false);onClose&&onClose()},260);
  }
  return(
    <div style={{position:'absolute',inset:0,zIndex:60}}>
      <div
        onClick={close}
        style={{
          position:'absolute',inset:0,
          background:'rgba(0,0,0,.45)',
          animation:'fadeIn .25s ease',
        }}
      />
      <div style={{
        position:'absolute',bottom:0,left:0,right:0,
        background:C.white,borderRadius:'22px 22px 0 0',
        maxHeight:maxH,overflowY:'auto',
        animation:closing?'sheetDown .26s var(--ease) forwards':'sheetUp .26s var(--ease)',
      }}>
        <div style={{display:'flex',justifyContent:'center',padding:'10px 0 0'}}>
          <div style={{width:36,height:5,borderRadius:999,background:C.ink3}}/>
        </div>
        {title&&(
          <div style={{padding:'14px 20px 12px',fontSize:16,fontWeight:600,color:C.ink9,borderBottom:`1px solid ${C.ink2}`}}>
            {title}
          </div>
        )}
        <div style={pad?{padding:'12px 16px 40px'}:{}}>{children}</div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════
   TOAST
════════════════════════════════════════ */
function Toast({msg,variant='kraft',onDone,duration=2800}){
  const [fading,setFading]=useState(false);
  const bg=variant==='kraft'?C.kraft:C.ink9;
  useEffect(()=>{
    const t=setTimeout(()=>setFading(true),duration);
    const t2=setTimeout(()=>onDone&&onDone(),duration+400);
    return()=>{clearTimeout(t);clearTimeout(t2)};
  },[]);
  return(
    <div style={{
      position:'absolute',top:54,left:'50%',
      background:bg,color:'white',fontSize:13,fontWeight:500,
      padding:'8px 18px',borderRadius:12,whiteSpace:'nowrap',
      zIndex:100,boxShadow:'0 4px 16px rgba(0,0,0,.22)',
      animation:fading?'toastOut .4s ease forwards':'toastIn .22s var(--ease)',
      pointerEvents:'none',
    }}>{msg}</div>
  );
}

/* ════════════════════════════════════════
   SHARE IMAGE CARD
════════════════════════════════════════ */
function ShareCard({cols=3,rows=3,inProgress=false}){
  const days=['一','二','三','四','五','六','日'],tod=3;
  const tRows=[
    {t:'17:30',l:'入场前',photos:[0,1,2]},
    {t:'18:00',l:'中场',photos:[3,4,null]},
    {t:'19:30',l:'高潮',photos:inProgress?[]:[5,6,7]},
  ].slice(0,rows);
  return(
    <div style={{background:C.pb,borderRadius:16,padding:14,boxShadow:'0 4px 14px rgba(40,80,140,.2)',width:'100%'}}>
      <div style={{border:'1px solid rgba(0,0,0,.07)',borderRadius:10,padding:10}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
          <div style={{background:'#FDFCF8',border:`1px solid ${C.kraft}`,borderRadius:6,padding:'2px 8px',fontFamily:'monospace',fontSize:9,color:C.kraft,letterSpacing:'.1em'}}>● RECORD</div>
          <div style={{display:'flex',gap:2}}>
            {days.map((d,i)=>(
              <div key={i} style={{textAlign:'center',width:17}}>
                <div style={{fontSize:6,color:C.ink5,fontFamily:'monospace'}}>{d}</div>
                <div style={{width:14,height:14,borderRadius:'50%',margin:'1px auto 0',background:i===tod?C.kraft:'transparent',display:'flex',alignItems:'center',justifyContent:'center',fontSize:6,color:i===tod?'white':C.ink5,fontFamily:'monospace'}}>{i+19}</div>
              </div>
            ))}
          </div>
        </div>
        {tRows.map((row,ri)=>(
          <div key={ri} style={{display:'flex',gap:6,marginBottom:ri<tRows.length-1?7:0}}>
            <div style={{width:40,flexShrink:0,paddingTop:3}}>
              <div style={{fontSize:7,fontFamily:'monospace',color:C.ink5,lineHeight:1.3}}>{row.t}</div>
              <div style={{fontSize:7,color:C.ink4,lineHeight:1.3}}>{row.l}</div>
            </div>
            <div style={{display:'flex',gap:3,flex:1}}>
              {Array.from({length:cols}).map((_,ci)=>{
                const has=ci<row.photos.length&&row.photos[ci]!==null;
                const rot=(ci%2===0?1:-1)*1.8;
                return has?(
                  <div key={ci} style={{flex:1,background:'#FDFCF8',padding:'3px 3px 7px',borderRadius:3,transform:`rotate(${rot}deg)`,boxShadow:'0 1px 4px rgba(0,0,0,.12)',position:'relative'}}>
                    <Img seed={row.photos[ci]||ci} h={32} r={2}/>
                    <div style={{position:'absolute',bottom:1,right:3,fontFamily:'Caveat',fontSize:7,color:C.ink4}}>{ri*cols+ci+1}</div>
                  </div>
                ):(
                  <div key={ci} style={{flex:1,height:42,borderRadius:3,background:'linear-gradient(135deg,#3A6FD0,#78AAFA)',display:'flex',alignItems:'center',justifyContent:'center',opacity:.46}}>
                    <span style={{color:'white',fontWeight:700,fontSize:9}}>M</span>
                  </div>
                );
              })}
            </div>
          </div>
        ))}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginTop:7,paddingTop:6,borderTop:'1px solid rgba(0,0,0,.06)'}}>
          <div style={{fontFamily:'Caveat',fontSize:10,color:C.ink5,transform:'rotate(-2deg)'}}>Recorded for you</div>
          <div style={{display:'flex',alignItems:'center',gap:4}}>
            <div style={{width:13,height:13,borderRadius:'50%',background:C.ink,display:'flex',alignItems:'center',justifyContent:'center'}}><span style={{color:'white',fontSize:7,fontWeight:700}}>M</span></div>
            <span style={{fontFamily:'monospace',fontSize:7,color:C.ink5}}>{cols*rows} frames</span>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════
   SCREEN: HOME (A1)
════════════════════════════════════════ */
function ScreenHome({push}){
  const [phase,setPhase]=useState(0);
  // 0=initial ai msg, 1=photo appeared, 2=chip visible, 3=chip dismissed
  const [chipCount,setChipCount]=useState(3);
  const [chipFading,setChipFading]=useState(false);
  const [sheet,setSheet]=useState(false);
  const chipRef=useRef(null);

  useEffect(()=>{
    // AI msg immediate, photo after 0.8s, chip after 1.8s
    const t1=setTimeout(()=>setPhase(1),800);
    const t2=setTimeout(()=>setPhase(2),1800);
    return()=>{clearTimeout(t1);clearTimeout(t2)};
  },[]);

  useEffect(()=>{
    if(phase!==2)return;
    let c=3;
    const iv=setInterval(()=>{
      c--;
      setChipCount(c);
      if(c<=0){
        clearInterval(iv);
        setChipFading(true);
        setTimeout(()=>setPhase(3),450);
      }
    },1000);
    return()=>clearInterval(iv);
  },[phase]);

  function tapChip(e){
    e.stopPropagation();
    setPhase(3);
    setTimeout(()=>setSheet(true),120);
  }

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%',background:C.paper}}>
      <Notch/>
      <SB/>
      <NB title="MindBack" right={<NBBtn color={C.ink5}><Share s={18}/></NBBtn>}/>
      {/* chat */}
      <div style={{flex:1,overflowY:'auto',padding:'12px 14px',display:'flex',flexDirection:'column',gap:12}}>
        {/* AI bubble */}
        <div style={{display:'flex',gap:8,alignItems:'flex-start',animation:'fadeIn .3s ease'}}>
          <div style={{width:30,height:30,borderRadius:'50%',background:C.ink,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:2}}>
            <span style={{color:'white',fontSize:12,fontWeight:700}}>M</span>
          </div>
          <div style={{background:C.warm,borderRadius:'4px 16px 16px 16px',padding:'10px 14px',maxWidth:'70%',fontSize:14,color:C.ink9,lineHeight:1.6}}>

const MOMENTS=[

  {idx:5,time:'21:00',label:'散场',slots:3,filled:0,state:'pending'},
];
function MCard({m,onTap}){
  const cfg={
    done:{bord:`1px solid ${C.ink2}`,bg:C.ink05,disc:C.ink2,discFg:C.ink5,badge:<Pill v="mint">已拍满</Pill>,tap:false},
    open:{bord:`1.5px solid ${C.kraft}`,bg:'#FDF7F5',disc:C.kraft,discFg:'white',badge:null,tap:true},
    full:{bord:`1px solid ${C.ink2}`,bg:C.ink05,disc:C.ink2,discFg:C.ink4,badge:<Pill sx={{background:C.ink1,color:C.ink4}}>坑位已满</Pill>,tap:false},
    pending:{bord:`1px solid ${C.ink2}`,bg:C.white,disc:C.ink2,discFg:C.ink5,badge:<Pill v="default">未开始</Pill>,tap:false},
  };
  const cf=cfg[m.state];
  return(
    <div
      onClick={cf.tap?onTap:undefined}
      style={{
        border:cf.bord,borderRadius:14,padding:'13px 14px',background:cf.bg,
        display:'flex',alignItems:'center',gap:12,marginBottom:8,
        opacity:m.state==='full'?0.52:1,
        cursor:cf.tap?'pointer':'default',
        transition:'transform .1s, box-shadow .1s',
      }}
      onMouseDown={cf.tap?e=>e.currentTarget.style.transform='scale(.98)':undefined}
      onMouseUp={cf.tap?e=>{e.currentTarget.style.transform='';e.currentTarget.style.boxShadow=''}:undefined}
    >
      <div style={{width:36,height:36,borderRadius:'50%',background:cf.disc,display:'flex',alignItems:'center',justifyContent:'center',color:cf.discFg,fontSize:14,fontWeight:700,fontFamily:'monospace',flexShrink:0}}>{m.idx}</div>
      <div style={{flex:1}}>
        <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:3}}>
          <span style={{fontSize:14,fontWeight:600,color:C.ink9}}>{m.label}</span>
          {cf.badge}
          {m.state==='open'&&<Pill v="kraft"><Spark s={9}/>&nbsp;推荐</Pill>}
        </div>
        <div style={{fontSize:12,color:C.ink5,display:'flex',alignItems:'center',gap:6}}>
          <Clock s={11}/> {m.time} · {m.filled}/{m.slots} 人

      </div>
      {cf.tap&&<Chev d="r" s={14}/>}
    </div>
  );
}

/* ════════════════════════════════════════
   NAVIGATION SYSTEM
════════════════════════════════════════ */
const SCREEN_MAP={
  home:ScreenHome,
  moments:ScreenMoments,
  publish:ScreenPublish,
  submitted:ScreenSubmitted,
  site:ScreenSite,
  create:ScreenCreate,
  'share-detail':ScreenShareDetail,
  'share-panel':ScreenSharePanel,
  completion:ScreenCompletion,
};

function Navigator({initialScreen='home'}){
  const [stack,setStack]=useState([{id:initialScreen,params:{},key:0}]);
  const [leaving,setLeaving]=useState(null);
  const [enterDir,setEnterDir]=useState('r'); // 'r' or 'l'
  const keyRef=useRef(1);

  const push=useCallback((id,params={})=>{
    const key=keyRef.current++;
    setEnterDir('r');
    setStack(s=>[...s,{id,params,key}]);
  },[]);

  const pop=useCallback(()=>{
    setStack(s=>{
      if(s.length<=1)return s;
      const top=s[s.length-1];
      setLeaving({...top,dir:'r'});
      setTimeout(()=>setLeaving(null),320);
      return s.slice(0,-1);
    });
  },[]);

  const reset=useCallback((id,params={})=>{
    const key=keyRef.current++;
    setEnterDir('r');
    setStack([{id,params,key}]);
  },[]);

  const current=stack[stack.length-1];
  const Comp=SCREEN_MAP[current.id]||ScreenHome;

  return(
    <NavCtx.Provider value={{push,pop,reset,stack}}>
      <div style={{position:'relative',width:'100%',height:'100%',overflow:'hidden',borderRadius:48}}>
        {/* Leaving screen */}
        {leaving&&(()=>{
          const LC=SCREEN_MAP[leaving.id]||ScreenHome;
          return(
            <div className={leaving.dir==='r'?'phone-screen exit-r':'phone-screen exit-l'} style={{zIndex:2}}>
              <LC push={push} pop={pop} params={leaving.params}/>
            </div>
          );
        })()}
        {/* Current screen */}
        <div
          key={current.key}
          className={`phone-screen ${stack.length>1?`enter-${enterDir}`:''}`}
          style={{zIndex:3}}
        >
          <Comp push={push} pop={pop} reset={reset} params={current.params}/>
        </div>
      </div>
    </NavCtx.Provider>
  );
}

  return(

}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
